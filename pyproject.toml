[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reposcroller"
version = "0.1.0"
description = "Modular multi-tier document ingestion and procedural intelligence engine with ALCOA+ compliance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "watchdog>=4.0.0",
    "pymupdf>=1.24.0",
    "langgraph>=0.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
graph = [
    "neo4j>=5.18.0",
]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
